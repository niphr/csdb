on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

name: Check and pkgdown

jobs:
  r-package:
    permissions:
      contents: write
    uses: niphr/cstemplate/.github/workflows/r-package.yml@main
    with:
      lint-allowlist: |
        R/r6_DBConnection_v9.R:cyclocomp_linter
        R/r6_DBTable_v9.R:cyclocomp_linter
        R/util_database.R:cyclocomp_linter
